<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f2742">
<title>Baybex Tile ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">B</div><div class="grow"><div id="shopName" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">…</div><div class="small" style="color:#94a3b8;font-weight:500" id="brandName"></div></div></div>
    <nav id="menu"></nav>
    <div style="padding:16px" class="small"><a href="#" id="supportLink" style="color:#5eead4;padding:0;border:0"></a></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="top">
      <button class="btn ghost menu-btn" id="menuBtn">☰</button>
      <div class="ttl grow" id="pageTitle"></div>
      <select class="in sm hide-m" id="branchSel" style="width:auto;max-width:200px"></select>
      <div class="seg"><button data-l="bn">বাং</button><button data-l="en">EN</button></div>
      <button class="btn sm" id="userBtn">👤 <span class="hide-m" id="userName"></span></button>
    </header>
    <div id="banners" style="padding:12px 16px 0"></div>
    <main class="content" id="content"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="/js/core.js"></script>
<script src="/js/app.js"></script>
<script src="/js/app2.js"></script>
</body>
</html>
